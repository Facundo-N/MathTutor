org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Fix: Kotlin incremental compilation fails on Windows when project and
# Pub cache are on different drives (e.g., D: vs C:).
kotlin.incremental=false
kotlin.incremental.java=false
# Use legacy R8 full mode to avoid compilation issues with certain plugins
android.enableR8.fullMode=false
